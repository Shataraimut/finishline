name: Feature request
description: Propose a new check, reference, template, or workflow.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What failure or uncertainty does the current project not address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Real examples, source patterns, or rendered observations. Do not invent evidence.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Static audit / rule
        - Component inventory
        - Schema / report
        - Capture
        - Workspace
        - Examples
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: False-positive risk
      description: What legitimate pattern could this incorrectly flag?
