[project]
name = "finishline-ui-audit"
version = "1.0.0"
description = "Evidence-first UI/UX quality audit and agent skill"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shataraimut" }]
keywords = ["ui", "ux", "accessibility", "design-system", "audit", "static-analysis"]
dependencies = []

[project.urls]
Homepage = "https://github.com/Shataraimut/finishline"
Issues = "https://github.com/Shataraimut/finishline/issues"
Changelog = "https://github.com/Shataraimut/finishline/blob/main/CHANGELOG.md"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
